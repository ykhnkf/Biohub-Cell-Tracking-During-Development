name: Biohub Kaggle Support Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/support-inventory-trigger]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: ykhnkf/biohub-support-pack-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: |
          pip install "kaggle>=2.2.4"
          kaggle --version
      - name: Build kernel
        run: |
          python -m py_compile scripts/build_support_inventory_kernel.py
          python scripts/build_support_inventory_kernel.py
          python -m py_compile .kaggle_support_inventory_kernel/run_inventory.py
      - name: Push kernel
        run: kaggle kernels push -p .kaggle_support_inventory_kernel -t 180
      - name: Wait for terminal state
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for i in $(seq 1 90); do
            s="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "$s"
            if echo "$s" | grep -Eqi 'complete|success'; then terminal=success; break; fi
            if echo "$s" | grep -Eqi 'error|fail|cancel'; then terminal=failure; break; fi
            sleep 10
          done
          [ -n "$terminal" ] || terminal=timeout
          echo "KAGGLE_TERMINAL=$terminal" >> "$GITHUB_ENV"
      - name: Download and validate
        shell: bash
        run: |
          set -u
          rm -rf kaggle-support-inventory-output
          mkdir -p kaggle-support-inventory-output
          rc=0
          kaggle kernels output "$KERNEL_REF" -p kaggle-support-inventory-output -o || rc=$?
          find kaggle-support-inventory-output -maxdepth 3 -type f -print || true
          log_file="$(find kaggle-support-inventory-output -maxdepth 2 -name '*.log' -type f | head -1 || true)"
          [ -z "$log_file" ] || tail -n 200 "$log_file"
          [ "$KAGGLE_TERMINAL" = success ] || { echo "Kaggle terminal=$KAGGLE_TERMINAL"; exit 1; }
          [ "$rc" -eq 0 ] || exit "$rc"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('kaggle-support-inventory-output/biohub_support_inventory')
          token=json.loads((root/'run_token.json').read_text())
          assert str(token['github_run_id']) == os.environ['GITHUB_RUN_ID']
          data=json.loads((root/'support_inventory.json').read_text())
          assert data['n_files'] > 0
          print(json.dumps(data, indent=2))
          PY
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biohub-support-inventory-${{ github.run_id }}
          path: kaggle-support-inventory-output/
          retention-days: 30
