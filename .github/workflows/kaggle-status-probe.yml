name: Biohub Kaggle Status Probe

on:
  push:
    branches: [main]
    paths: [.github/status-probe-trigger]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: pip install -q "kaggle>=2.2.4"
      - name: Fetch oracle diagnostics
        shell: bash
        run: |
          set -u
          ref=ykhnkf/biohub-gt-node-linking-oracle-audit
          rm -rf /tmp/oracle
          mkdir -p /tmp/oracle
          kaggle kernels status "$ref" || true
          kaggle kernels output "$ref" -p /tmp/oracle -o || true
          echo '=== fatal_error.json ==='
          cat /tmp/oracle/biohub_linking_oracle/fatal_error.json || true
          echo '=== kernel log tail ==='
          log="$(find /tmp/oracle -maxdepth 2 -name '*.log' -type f | head -1 || true)"
          [ -z "$log" ] || tail -n 250 "$log"
