name: Biohub Kaggle Status Probe

on:
  push:
    branches: [main]
    paths: [.github/status-probe-trigger]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: |
          pip install -q "kaggle>=2.2.4"
          kaggle --version
      - name: List recent owned kernels and statuses
        shell: bash
        run: |
          set -u
          echo '=== RECENT OWNED KERNELS CSV ==='
          kaggle kernels list --mine --page-size 100 --sort-by dateRun -v || true
          echo '=== KERNELS CLI HELP ==='
          kaggle kernels --help || true
          echo '=== KNOWN BIOHUB REFS ==='
          for ref in \
            ykhnkf/biohub-cell-tracking-oof-pilot \
            ykhnkf/biohub-pretrained-reference \
            ykhnkf/biohub-strict-oof-smoke \
            ykhnkf/biohub-pretrained-reference-diagnostics \
            ykhnkf/biohub-strict-oof-train-predict-score-smoke \
            ykhnkf/biohub-gt-node-linking-oracle-audit; do
            echo "--- $ref ---"
            kaggle kernels status "$ref" || true
          done
