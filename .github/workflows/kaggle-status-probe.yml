name: Biohub Kaggle Status Probe

on:
  push:
    branches: [main]
    paths: [.github/status-probe-trigger]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: |
          pip install -q "kaggle>=2.2.4"
          kaggle --version
      - name: List my kernels
        shell: bash
        run: |
          set -u
          echo '=== kaggle kernels list --mine ==='
          kaggle kernels list --mine --page-size 100 || true
      - name: Probe kernels
        shell: bash
        run: |
          set -u
          for ref in \
            ykhnkf/biohub-pretrained-reference \
            ykhnkf/biohub-strict-oof-smoke \
            ykhnkf/biohub-linking-oracle-audit; do
            echo "=== STATUS $ref ==="
            kaggle kernels status "$ref" || true
            echo "=== FILES $ref ==="
            kaggle kernels files "$ref" --page-size 100 || true
            echo "=== OUTPUT PROBE $ref ==="
            rm -rf /tmp/kaggle-probe-output
            mkdir -p /tmp/kaggle-probe-output
            kaggle kernels output "$ref" -p /tmp/kaggle-probe-output -o || true
            find /tmp/kaggle-probe-output -maxdepth 3 -type f -printf '%p %s bytes\n' || true
          done
