name: Biohub Kaggle Status Probe

on:
  push:
    branches: [main]
    paths: [.github/status-probe-trigger]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: pip install -q "kaggle>=2.2.4"
      - name: Probe kernels
        shell: bash
        run: |
          set -u
          for ref in \
            ykhnkf/biohub-pretrained-reference \
            ykhnkf/biohub-strict-oof-smoke \
            ykhnkf/biohub-linking-oracle-audit; do
            echo "=== $ref ==="
            kaggle kernels status "$ref" || true
          done
