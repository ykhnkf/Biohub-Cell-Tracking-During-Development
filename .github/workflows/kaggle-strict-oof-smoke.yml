name: Biohub Kaggle Strict OOF Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/strict-oof-smoke-trigger]

permissions:
  contents: read

concurrency:
  group: biohub-kaggle-strict-oof-smoke
  cancel-in-progress: true

jobs:
  strict-oof-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: |
          pip install "kaggle>=2.2.4"
          kaggle --version
      - name: Build kernel
        run: |
          python -m py_compile scripts/build_cv_audit_kernel_v3.py scripts/build_cv_audit_kernel_v4.py scripts/build_cv_audit_kernel_v5.py scripts/build_cv_audit_kernel_v6.py scripts/build_cv_audit_kernel_v7.py scripts/build_strict_oof_smoke_kernel.py scripts/build_strict_oof_smoke_kernel_v2.py scripts/build_strict_oof_smoke_kernel_v3.py scripts/build_strict_oof_smoke_kernel_v4.py
          python scripts/build_strict_oof_smoke_kernel_v4.py
          python -m py_compile .kaggle_strict_oof_smoke_kernel/run_strict_oof_smoke.py
      - name: Verify access
        run: |
          test -n "$KAGGLE_API_TOKEN"
          kaggle competitions files biohub-cell-tracking-during-development >/dev/null
      - name: Push kernel on T4 and resolve actual Kaggle ref
        shell: bash
        run: |
          set -euo pipefail
          push_log="$(mktemp)"
          kaggle kernels push -p .kaggle_strict_oof_smoke_kernel --accelerator NvidiaTeslaT4 -t 180 2>&1 | tee "$push_log"
          kernel_url="$(grep -Eo 'https://www\.kaggle\.com/code/[^[:space:]]+' "$push_log" | tail -1 || true)"
          if [ -z "$kernel_url" ]; then
            echo "::error::Could not parse Kaggle kernel URL from push output."
            cat "$push_log"
            exit 1
          fi
          kernel_ref="$(printf '%s' "$kernel_url" | sed -E 's#https://www\.kaggle\.com/code/([^/]+/[^/?[:space:]]+).*#\1#')"
          if ! echo "$kernel_ref" | grep -Eq '^[^/]+/[^/]+$'; then
            echo "::error::Invalid Kaggle ref '$kernel_ref'."
            exit 1
          fi
          echo "Resolved Kaggle ref: $kernel_ref"
          echo "KERNEL_REF=$kernel_ref" >> "$GITHUB_ENV"
          echo "KERNEL_URL=$kernel_url" >> "$GITHUB_ENV"
      - name: Wait for terminal state
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for i in $(seq 1 720); do
            s="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "$s"
            if echo "$s" | grep -Eqi 'complete|success'; then terminal=success; break; fi
            if echo "$s" | grep -Eqi 'error|fail|cancel'; then terminal=failure; break; fi
            sleep 15
          done
          [ -n "$terminal" ] || terminal=timeout
          echo "KAGGLE_TERMINAL=$terminal" >> "$GITHUB_ENV"
          echo "Kaggle ref: $KERNEL_REF ($KERNEL_URL)"
      - name: Download and validate
        shell: bash
        run: |
          set -u
          rm -rf kaggle-strict-oof-smoke-output
          mkdir -p kaggle-strict-oof-smoke-output
          rc=0
          kaggle kernels output "$KERNEL_REF" -p kaggle-strict-oof-smoke-output -o || rc=$?
          find kaggle-strict-oof-smoke-output -maxdepth 4 -type f -print || true
          log_file="$(find kaggle-strict-oof-smoke-output -maxdepth 2 -name '*.log' -type f | head -1 || true)"
          [ -z "$log_file" ] || { echo '=== log tail ==='; tail -n 300 "$log_file"; }
          root=kaggle-strict-oof-smoke-output/biohub_strict_oof_smoke
          for f in \
            run_token strict_input_layout progress split_manifest training_summary fatal_error oof_smoke_summary \
            stage_00_enter_run stage_01_input_ok stage_02_before_support stage_03_support_ok \
            stage_04_before_dependencies stage_05_dependencies_ok stage_06_official_source_ok \
            stage_07_imports_ok stage_08_before_train stage_09_train_returned; do
            [ ! -f "$root/$f.json" ] || { echo "=== $f ==="; cat "$root/$f.json"; }
          done
          [ "$KAGGLE_TERMINAL" = success ] || { echo "Kaggle terminal=$KAGGLE_TERMINAL for $KERNEL_REF"; exit 1; }
          [ "$rc" -eq 0 ] || exit "$rc"
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          root=Path('kaggle-strict-oof-smoke-output/biohub_strict_oof_smoke')
          req=['run_token.json','strict_input_layout.json','split_manifest.json','training_summary.json','prediction_manifest.csv','oof_smoke_per_dataset.csv','oof_smoke_summary.json','stage_09_train_returned.json']
          miss=[x for x in req if not (root/x).is_file()]
          if miss: raise SystemExit(f'Missing outputs: {miss}')
          if (root/'fatal_error.json').exists(): raise SystemExit('fatal_error.json present')
          token=json.loads((root/'run_token.json').read_text())
          if str(token.get('github_run_id')) != os.environ['GITHUB_RUN_ID']: raise SystemExit('stale Kaggle output')
          split=json.loads((root/'split_manifest.json').read_text())
          if set(split['train']) & set(split['validation']): raise SystemExit('train/validation overlap detected')
          layout=json.loads((root/'strict_input_layout.json').read_text())
          if not layout.get('selected'): raise SystemExit('no train root selected')
          s=json.loads((root/'oof_smoke_summary.json').read_text())
          if s.get('status') != 'passed' or not s.get('training',{}).get('random_init'): raise SystemExit(f'bad strict OOF status: {s}')
          score=float(s['official']['score'])
          if not math.isfinite(score): raise SystemExit('non-finite official score')
          print(json.dumps(s,indent=2))
          PY
          echo '=== per dataset ==='
          cat "$root/oof_smoke_per_dataset.csv"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biohub-strict-oof-smoke-${{ github.run_id }}
          path: kaggle-strict-oof-smoke-output/
          retention-days: 30
