name: Biohub Strict OOF Validation Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/strict-oof-val-inventory-trigger*]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install Kaggle CLI
        run: pip install -q "kaggle>=2.2.4"
      - name: Build
        run: |
          python -m py_compile scripts/build_cv_audit_kernel_v3.py scripts/build_cv_audit_kernel_v7.py scripts/build_strict_oof_smoke_kernel.py scripts/build_strict_oof_val_inventory_kernel.py
          python scripts/build_strict_oof_val_inventory_kernel.py
          python -m py_compile .kaggle_strict_oof_val_inventory_kernel/run_val_inventory.py
      - name: Push
        shell: bash
        run: |
          set -euo pipefail
          log=$(mktemp)
          kaggle kernels push -p .kaggle_strict_oof_val_inventory_kernel -t 120 2>&1 | tee "$log"
          url=$(grep -Eo 'https://www\.kaggle\.com/code/[^[:space:]]+' "$log" | tail -1)
          ref=$(printf '%s' "$url" | sed -E 's#https://www\.kaggle\.com/code/([^/]+/[^/?[:space:]]+).*#\1#')
          echo "KERNEL_REF=$ref" >> "$GITHUB_ENV"
      - name: Wait
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            s=$(kaggle kernels status "$KERNEL_REF" 2>&1 || true); echo "$s"
            echo "$s" | grep -Eqi 'complete|success' && exit 0
            echo "$s" | grep -Eqi 'error|fail|cancel' && exit 1
            sleep 10
          done
          exit 1
      - name: Download
        run: |
          mkdir -p val-inventory-output
          kaggle kernels output "$KERNEL_REF" -p val-inventory-output -o
          cat val-inventory-output/biohub_strict_oof_val_inventory/val_inventory.json
          test ! -f val-inventory-output/biohub_strict_oof_val_inventory/fatal_error.json
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biohub-val-inventory-${{ github.run_id }}
          path: val-inventory-output/
          retention-days: 30
