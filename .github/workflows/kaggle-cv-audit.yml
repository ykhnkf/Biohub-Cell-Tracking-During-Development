name: Biohub Kaggle CV Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/cv-audit-trigger

permissions:
  contents: read

concurrency:
  group: biohub-kaggle-cv-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: ykhnkf/biohub-cell-tracking-cv-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install "kaggle>=2.2.4"
          kaggle --version

      - name: Build and compile private Kaggle audit kernel
        run: |
          rm -rf .kaggle_cv_audit_kernel
          python -m py_compile scripts/build_cv_audit_kernel_v3.py scripts/build_cv_audit_kernel_v4.py scripts/build_cv_audit_kernel_v5.py scripts/build_cv_audit_kernel_v6.py scripts/build_cv_audit_kernel_v7.py scripts/evaluate_oof_graphs.py
          python scripts/build_cv_audit_kernel_v7.py
          python -m py_compile .kaggle_cv_audit_kernel/run_audit.py
          cat .kaggle_cv_audit_kernel/kernel-metadata.json

      - name: Verify Kaggle auth and competition access
        run: |
          test -n "$KAGGLE_API_TOKEN" || (echo "KAGGLE_API_TOKEN repository secret is missing" && exit 1)
          kaggle competitions files biohub-cell-tracking-during-development >/dev/null

      - name: Push audit kernel to Kaggle
        run: kaggle kernels push -p .kaggle_cv_audit_kernel -t 180

      - name: Wait for Kaggle audit terminal state
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          last_status=""
          for i in $(seq 1 180); do
            echo "Poll $i"
            last_status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "$last_status"
            if echo "$last_status" | grep -Eqi 'complete|success'; then
              terminal="success"
              break
            fi
            if echo "$last_status" | grep -Eqi 'error|fail|cancel'; then
              terminal="failure"
              break
            fi
            sleep 20
          done
          if [ -z "$terminal" ]; then
            terminal="timeout"
          fi
          echo "KAGGLE_TERMINAL=$terminal" >> "$GITHUB_ENV"
          echo "Kaggle terminal state: $terminal"

      - name: Download and validate audit outputs
        shell: bash
        run: |
          set -u
          rm -rf kaggle-audit-output
          mkdir -p kaggle-audit-output

          output_rc=0
          kaggle kernels output "$KERNEL_REF" -p kaggle-audit-output -o || output_rc=$?
          find kaggle-audit-output -maxdepth 5 -type f -print || true

          log_file="$(find kaggle-audit-output -maxdepth 2 -name '*.log' -type f | head -1 || true)"
          if [ -n "$log_file" ]; then
            echo "=== Kaggle kernel log tail ==="
            tail -n 250 "$log_file"
          fi

          for diagnostic in run_token train_layout progress dependency_probe last_pip import_failures dependency_after graph_failures fatal_error; do
            file="kaggle-audit-output/biohub_cv_audit/${diagnostic}.json"
            if [ -f "$file" ]; then
              echo "=== ${diagnostic}.json ==="
              cat "$file"
            fi
          done

          if [ "$KAGGLE_TERMINAL" != "success" ]; then
            echo "::error::Kaggle kernel ended with terminal state '$KAGGLE_TERMINAL'."
            exit 1
          fi
          if [ "$output_rc" -ne 0 ]; then
            echo "::error::kaggle kernels output failed with exit code $output_rc."
            exit "$output_rc"
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("kaggle-audit-output/biohub_cv_audit")
          required = [
              root / "run_token.json",
              root / "summary.json",
              root / "dataset_manifest.csv",
              root / "folds_balanced_5.json",
              root / "official_metric_selftest.json",
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit("Missing required audit outputs: " + ", ".join(missing))

          token = json.loads((root / "run_token.json").read_text())
          expected_run = os.environ["GITHUB_RUN_ID"]
          if str(token.get("github_run_id")) != expected_run:
              raise SystemExit(
                  f"Stale Kaggle output: run token {token.get('github_run_id')!r} != current GitHub run {expected_run!r}"
              )

          summary = json.loads((root / "summary.json").read_text())
          selftest = json.loads((root / "official_metric_selftest.json").read_text())
          if int(summary.get("n_geffs_found", -1)) != int(summary.get("n_datasets_loaded", -2)):
              raise SystemExit(f"Incomplete GT scan: {summary}")
          if int(summary.get("n_graph_failures", -1)) != 0:
              raise SystemExit(f"GT graph failures detected: {summary}")
          if selftest.get("status") != "passed":
              raise SystemExit(f"Official metric self-test did not pass: {selftest}")
          if not selftest.get("edge_identity_ok") or not selftest.get("division_identity_ok"):
              raise SystemExit(f"Official metric identity checks failed: {selftest}")

          print("Validated current-run Kaggle outputs.")
          print(json.dumps({
              "n_datasets_loaded": summary["n_datasets_loaded"],
              "metric_selftest": selftest,
          }, indent=2))
          PY

          echo "=== dataset_manifest.csv ==="
          cat kaggle-audit-output/biohub_cv_audit/dataset_manifest.csv
          echo "=== summary.json ==="
          cat kaggle-audit-output/biohub_cv_audit/summary.json
          echo "=== official_metric_selftest.json ==="
          cat kaggle-audit-output/biohub_cv_audit/official_metric_selftest.json
          echo "=== folds_balanced_5.json ==="
          cat kaggle-audit-output/biohub_cv_audit/folds_balanced_5.json

      - name: Upload CV audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biohub-cv-audit-${{ github.run_id }}
          path: kaggle-audit-output/
          if-no-files-found: warn
          retention-days: 30
