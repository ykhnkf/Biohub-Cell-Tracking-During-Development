name: Biohub Kaggle CV Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/cv-audit-trigger

permissions:
  contents: read

concurrency:
  group: biohub-kaggle-cv-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: ykhnkf/biohub-cell-tracking-cv-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install "kaggle>=2.2.4"
          kaggle --version

      - name: Build and compile private Kaggle audit kernel
        run: |
          rm -rf .kaggle_cv_audit_kernel
          python -m py_compile scripts/build_cv_audit_kernel.py scripts/evaluate_oof_graphs.py
          python scripts/build_cv_audit_kernel.py
          python -m py_compile .kaggle_cv_audit_kernel/run_audit.py
          cat .kaggle_cv_audit_kernel/kernel-metadata.json

      - name: Verify Kaggle auth and competition access
        run: |
          test -n "$KAGGLE_API_TOKEN" || (echo "KAGGLE_API_TOKEN repository secret is missing" && exit 1)
          kaggle competitions files biohub-cell-tracking-during-development >/dev/null

      - name: Push audit kernel to Kaggle
        run: kaggle kernels push -p .kaggle_cv_audit_kernel -t 180

      - name: Wait for Kaggle audit terminal state
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for i in $(seq 1 180); do
            echo "Poll $i"
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "$status"
            if echo "$status" | grep -Eqi 'complete|success'; then
              terminal="success"
              break
            fi
            if echo "$status" | grep -Eqi 'error|fail|cancel'; then
              terminal="failure"
              break
            fi
            sleep 20
          done
          if [ -z "$terminal" ]; then
            terminal="timeout"
          fi
          echo "KAGGLE_TERMINAL=$terminal" >> "$GITHUB_ENV"
          echo "Kaggle terminal state: $terminal"

      - name: Download audit outputs and diagnostics
        shell: bash
        run: |
          set -u
          rm -rf kaggle-audit-output
          mkdir -p kaggle-audit-output
          kaggle kernels output "$KERNEL_REF" -p kaggle-audit-output -o || true
          find kaggle-audit-output -maxdepth 5 -type f -print || true

          if [ -f kaggle-audit-output/biohub_cv_audit/fatal_error.json ]; then
            echo "=== Kaggle fatal_error.json ==="
            cat kaggle-audit-output/biohub_cv_audit/fatal_error.json
          fi

          if [ -f kaggle-audit-output/biohub_cv_audit/dependency_probe.json ]; then
            echo "=== dependency_probe.json ==="
            cat kaggle-audit-output/biohub_cv_audit/dependency_probe.json
          fi

          if [ ! -f kaggle-audit-output/biohub_cv_audit/summary.json ]; then
            echo "Audit did not produce summary.json (terminal=$KAGGLE_TERMINAL)"
            exit 1
          fi

          echo "=== summary.json ==="
          cat kaggle-audit-output/biohub_cv_audit/summary.json
          echo "=== official_metric_selftest.json ==="
          cat kaggle-audit-output/biohub_cv_audit/official_metric_selftest.json

      - name: Upload CV audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biohub-cv-audit-${{ github.run_id }}
          path: kaggle-audit-output/biohub_cv_audit/
          if-no-files-found: warn
          retention-days: 30
