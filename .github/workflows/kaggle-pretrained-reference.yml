name: Biohub Kaggle Pretrained Reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/pretrained-reference-trigger]

permissions:
  contents: read

concurrency:
  group: biohub-kaggle-pretrained-reference
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: |
          pip install "kaggle>=2.2.4"
          kaggle --version
      - name: Build kernel
        run: |
          python -m py_compile scripts/build_cv_audit_kernel_v3.py scripts/build_cv_audit_kernel_v4.py scripts/build_cv_audit_kernel_v5.py scripts/build_cv_audit_kernel_v6.py scripts/build_cv_audit_kernel_v7.py scripts/build_pretrained_reference_kernel.py scripts/build_pretrained_reference_kernel_v2.py scripts/build_pretrained_reference_kernel_v3.py
          python scripts/build_pretrained_reference_kernel_v3.py
          python -m py_compile .kaggle_pretrained_reference_kernel/run_reference.py
      - name: Verify access
        run: |
          test -n "$KAGGLE_API_TOKEN"
          kaggle competitions files biohub-cell-tracking-during-development >/dev/null
      - name: Push kernel and resolve actual Kaggle ref
        shell: bash
        run: |
          set -euo pipefail
          push_log="$(mktemp)"
          kaggle kernels push -p .kaggle_pretrained_reference_kernel -t 180 2>&1 | tee "$push_log"
          kernel_url="$(grep -Eo 'https://www\.kaggle\.com/code/[^[:space:]]+' "$push_log" | tail -1 || true)"
          if [ -z "$kernel_url" ]; then
            echo "::error::Could not parse Kaggle kernel URL from push output."
            cat "$push_log"
            exit 1
          fi
          kernel_ref="$(printf '%s' "$kernel_url" | sed -E 's#https://www\.kaggle\.com/code/([^/]+/[^/?[:space:]]+).*#\1#')"
          if ! echo "$kernel_ref" | grep -Eq '^[^/]+/[^/]+$'; then
            echo "::error::Invalid Kaggle ref '$kernel_ref'."
            exit 1
          fi
          echo "Resolved Kaggle ref: $kernel_ref"
          echo "KERNEL_REF=$kernel_ref" >> "$GITHUB_ENV"
          echo "KERNEL_URL=$kernel_url" >> "$GITHUB_ENV"
      - name: Wait for terminal state
        shell: bash
        run: |
          set -euo pipefail
          terminal=""
          for i in $(seq 1 360); do
            s="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "$s"
            if echo "$s" | grep -Eqi 'complete|success'; then terminal=success; break; fi
            if echo "$s" | grep -Eqi 'error|fail|cancel'; then terminal=failure; break; fi
            sleep 15
          done
          [ -n "$terminal" ] || terminal=timeout
          echo "KAGGLE_TERMINAL=$terminal" >> "$GITHUB_ENV"
          echo "Kaggle ref: $KERNEL_REF ($KERNEL_URL)"
      - name: Download and validate
        shell: bash
        run: |
          set -u
          rm -rf kaggle-pretrained-reference-output
          mkdir -p kaggle-pretrained-reference-output
          rc=0
          kaggle kernels output "$KERNEL_REF" -p kaggle-pretrained-reference-output -o || rc=$?
          find kaggle-pretrained-reference-output -maxdepth 4 -type f -print || true
          log_file="$(find kaggle-pretrained-reference-output -maxdepth 2 -name '*.log' -type f | head -1 || true)"
          [ -z "$log_file" ] || { echo '=== log tail ==='; tail -n 250 "$log_file"; }
          root=kaggle-pretrained-reference-output/biohub_pretrained_reference
          for f in run_token progress fatal_error reference_summary; do [ ! -f "$root/$f.json" ] || { echo "=== $f ==="; cat "$root/$f.json"; }; done
          [ "$KAGGLE_TERMINAL" = success ] || { echo "Kaggle terminal=$KAGGLE_TERMINAL for $KERNEL_REF"; exit 1; }
          [ "$rc" -eq 0 ] || exit "$rc"
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          root=Path('kaggle-pretrained-reference-output/biohub_pretrained_reference')
          required=['run_token.json','prediction_manifest.csv','reference_per_dataset.csv','reference_summary.json']
          missing=[x for x in required if not (root/x).is_file()]
          if missing: raise SystemExit(f'Missing outputs: {missing}')
          if (root/'fatal_error.json').exists(): raise SystemExit('fatal_error.json present')
          tok=json.loads((root/'run_token.json').read_text())
          if str(tok.get('github_run_id')) != os.environ['GITHUB_RUN_ID']: raise SystemExit('stale Kaggle output')
          s=json.loads((root/'reference_summary.json').read_text())
          if s.get('status') != 'passed': raise SystemExit(f'bad status: {s}')
          if s.get('provenance') != 'non_oof_pretrained_reference_unknown_train_overlap': raise SystemExit('provenance label missing')
          score=float(s['official']['score'])
          if not math.isfinite(score): raise SystemExit('non-finite score')
          print(json.dumps(s, indent=2))
          PY
          echo '=== per dataset ==='
          cat "$root/reference_per_dataset.csv"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biohub-pretrained-reference-${{ github.run_id }}
          path: kaggle-pretrained-reference-output/
          retention-days: 30
